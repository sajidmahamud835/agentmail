name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: shellcheck -x scripts/*.sh tests/integration.sh
      - run: npm audit --audit-level=moderate
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y restic jq
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Exercise the mail stack and recovery
        run: sudo env "PATH=$PATH" "RUNNER_TEMP=$RUNNER_TEMP" AGENTPOST_CI=true bash tests/integration.sh
      - name: Service diagnostics
        if: failure()
        run: |
          sudo docker ps -a
          sudo docker compose logs --tail=100 database web worker smtp inbox caddy || true
      - name: Stop disposable stack
        if: always()
        run: sudo docker compose down || true
